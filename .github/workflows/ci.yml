name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate ocn-1 catalogue (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: byte-compile tools
        run: python3 -m py_compile tools/apply_attribution_manifest.py tools/audit_chess.py tools/audit_naming_attribution.py tools/audit_transpositions.py tools/candidate_slice_export.py tools/chess_uci.py tools/export_positions.py tools/from_eco.py tools/from_position.py tools/from_uci.py tools/lichess_parent_map.py tools/scaffold_attribution_manifest.py tools/validate.py tools/verify_doc_slugs.py

      - name: validate canonical catalogue
        run: python3 tools/validate.py

      - name: validate canonical catalogue with strict chess checks
        run: python3 tools/validate.py --strict-chess

      - name: run tool test suite
        run: python3 -m unittest discover -s tools/tests

      - name: check Lichess parent mapping fixture
        run: python3 tools/lichess_parent_map.py --check tools/tests/fixtures/lichess_sample.tsv

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate ocn-1 catalogue (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: byte-compile tools
        run: python3 -m py_compile tools/audit_chess.py tools/chess_uci.py tools/from_eco.py tools/from_uci.py tools/validate.py

      - name: validate canonical catalogue
        run: python3 tools/validate.py

      - name: validate canonical catalogue with strict chess checks
        run: python3 tools/validate.py --strict-chess

      - name: run tool test suite
        run: python3 -m unittest discover -s tools/tests

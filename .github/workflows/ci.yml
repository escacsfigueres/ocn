name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate ocn-1 catalogue (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: byte-compile tools
        # Compile every tool, not a hand-maintained subset — the list used to
        # drift (build_lichess_xref.py, generate_diacritic_manifest.py, ocn.py
        # were all missing). test_tools_compile.py guards this locally too.
        run: python3 -m py_compile tools/*.py

      - name: validate canonical catalogue
        run: python3 tools/validate.py

      - name: validate canonical catalogue with strict chess checks
        run: python3 tools/validate.py --strict-chess

      - name: run tool test suite
        run: python3 -m unittest discover -s tools/tests

      - name: check Lichess parent mapping fixture
        run: python3 tools/lichess_parent_map.py --check tools/tests/fixtures/lichess_sample.tsv

      - name: run package test suite
        # Runs against src/ directly, before any install: the suite must
        # not need a build step or network access.
        run: python3 -m unittest discover -s tests

      - name: install the package
        run: python3 -m pip install -e .

      - name: check the installed console script
        # The roadmap's H1.1 acceptance criterion, checked every push.
        run: |
          ocn version
          ocn lookup B90
          python3 -c "import ocn; print(len(ocn.Catalog.load()))"
